name: ci

on: [push, pull_request]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        host: [claude, codex, generic]
    runs-on: ${{ matrix.os }}
    env:
      CERBERUS_HOST: ${{ matrix.host }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: make build
      - run: make test
      - run: make lint

  build-matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        arch: [amd64, arm64]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: |
          GOOS=$([ "${{ matrix.os }}" = "macos-latest" ] && echo darwin || echo linux) \
          GOARCH=${{ matrix.arch }} \
          go build -ldflags="-s -w" -tags netgo -o bin/cerberus.${{ matrix.os }}.${{ matrix.arch }} ./cmd/cerberus
      - name: Binary-size assertion (D35)
        run: |
          # D35 binary-size assertion (30 MB cap on darwin-arm64; 35 MB elsewhere)
          SIZE=$(stat -c%s bin/cerberus.${{ matrix.os }}.${{ matrix.arch }} 2>/dev/null || stat -f%z bin/cerberus.${{ matrix.os }}.${{ matrix.arch }})
          CAP=$([ "${{ matrix.os }}-${{ matrix.arch }}" = "macos-latest-arm64" ] && echo $((30*1024*1024)) || echo $((35*1024*1024)))
          if [ "$SIZE" -gt "$CAP" ]; then echo "binary size $SIZE exceeds cap $CAP"; exit 1; fi
