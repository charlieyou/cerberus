# Cerberus runs Gemini as an external reviewer. Permit local codebase reads only.
#
# Host-neutrality (verified Phase 0 — see plan §Deviation Log entry for
# "Skeleton omitted gemini-readonly-policy.toml cross-host check"):
# These rules are tool-name based and contain no host-specific paths,
# Claude-specific assumptions, or `${CLAUDE_*}` references. The settings
# and policy files are loaded from `$PLUGIN_ROOT/config/...`, where
# `$PLUGIN_ROOT` is resolved via `__cerberus_resolve_root` and therefore
# follows `CERBERUS_ROOT` (with `CLAUDE_PLUGIN_ROOT` as alias). The
# policy applies cleanly under `CERBERUS_HOST=claude`, `codex`, `amp`,
# and `generic`. See `bin/tests/test-review-gate-gemini-policy.sh` for
# the cross-host assertion. No host-specific knobs are required.

[[rule]]
toolName = [
  "glob",
  "grep_search",
  "list_directory",
  "read_file",
  "read_many_files"
]
decision = "allow"
priority = 999

[[rule]]
toolName = "*"
mcpName = "*"
decision = "deny"
priority = 999
denyMessage = "Cerberus Gemini reviewers run without MCP tools."

[[rule]]
toolName = "*"
decision = "deny"
priority = 900
denyMessage = "Cerberus Gemini reviewers are read-only and may only inspect local files."
